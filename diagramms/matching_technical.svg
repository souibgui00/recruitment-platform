@startuml matching_technical

skinparam classAttributeIconSize 0
skinparam shadowing false
skinparam class {
  BackgroundColor #FEFECE
  BorderColor #A80036
  ArrowColor #A80036
}

title Moteur de matching — Services techniques

interface IEmbeddingSimilarityCalculator <<port>> {
  + cosineSimilarity(vecA: float[], vecB: float[]) : float
}

class CosineSimilarityCalculator {
  + cosineSimilarity(vecA: float[], vecB: float[]) : float
}

interface ILLMMatchingEvaluator <<port>> {
  + evaluate(cv: CV, offer: JobOffer) : LLMAssessment
}

class ClaudeMatchingEvaluator {
  + evaluate(cv: CV, offer: JobOffer) : LLMAssessment
}

interface IMatchRepository <<port>> {
  + save(match: Match) : void
  + findByCvAndOffer(cvId: UUID, offerId: UUID) : Match
}

class MatchingService {
  - similarityCalculator : IEmbeddingSimilarityCalculator
  - llmEvaluator : ILLMMatchingEvaluator
  - repository : IMatchRepository
  - -
  + computeMatch(cv: CV, offer: JobOffer, config: MatchingConfig) : Match
  - combineScores(semanticSimilarity: float, llmAssessment: LLMAssessment, config: MatchingConfig) : float
}

IEmbeddingSimilarityCalculator <|.. CosineSimilarityCalculator
ILLMMatchingEvaluator <|.. ClaudeMatchingEvaluator

MatchingService - -> IEmbeddingSimilarityCalculator : utilise
MatchingService - -> ILLMMatchingEvaluator : utilise
MatchingService - -> IMatchRepository : utilise

@enduml

