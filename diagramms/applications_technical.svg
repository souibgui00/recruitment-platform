@startuml applications_technical

skinparam classAttributeIconSize 0
skinparam shadowing false
skinparam class {
  BackgroundColor #FEFECE
  BorderColor #A80036
  ArrowColor #A80036
}

title Gestion des candidatures — Services techniques

interface IApplicationChannel <<port>> {
  + submit(application: Application, cv: CV, offer: JobOffer) : SubmissionResult
}

class LinkedInApplicationChannel {
  + submit(application: Application, cv: CV, offer: JobOffer) : SubmissionResult
}

class EmailApplicationChannel {
  + submit(application: Application, cv: CV, offer: JobOffer) : SubmissionResult
}

class SubmissionResult <<Value Object>> {
  - success : boolean
  - errorMessage : string
  - submittedAt : DateTime
}

interface IApplicationRepository <<port>> {
  + save(application: Application) : void
  + findPendingValidation(userId: UUID) : Application[]
  + findById(id: UUID) : Application
}

class ApplicationOrchestrator {
  - channels : IApplicationChannel[]
  - repository : IApplicationRepository
  - -
  + processMatch(match: Match, settings: UserAutoApplySettings) : Application
  - shouldAutoApply(match: Match, settings: UserAutoApplySettings) : boolean
}

IApplicationChannel <|.. LinkedInApplicationChannel
IApplicationChannel <|.. EmailApplicationChannel

ApplicationOrchestrator - -> IApplicationChannel : utilise
ApplicationOrchestrator - -> IApplicationRepository : utilise
IApplicationChannel ..> SubmissionResult : produit

@enduml

