link Notification to NotificationStatus--><path d="M336.34,211.0531 C356.32,231.9031 376.66,253.1231 393.57,270.7631 " fill="none" id="Notification-NotificationStatus" style="stroke: #A80036; stroke-width: 1.0;"/><!--MD5=[027a36d51252ab7a0a6f86a1c89d2255]
@startuml notifications_domain

skinparam classAttributeIconSize 0
skinparam shadowing false
skinparam class {
  BackgroundColor #FEFECE
  BorderColor #A80036
  ArrowColor #A80036
}

title Notifications — Modèle du domaine

enum NotificationType {
  APPLICATION_SENT
  APPLICATION_FAILED
}

enum NotificationChannel {
  EMAIL
  IN_APP
}

enum NotificationStatus {
  PENDING
  SENT
  FAILED
}

class Notification <<Aggregate Root>> {
  - id : UUID
  - userId : UUID
  - type : NotificationType
  - channel : NotificationChannel
  - relatedApplicationId : UUID
  - message : string
  - status : NotificationStatus
  - sentAt : DateTime
  - -
  + markAsSent() : void
  + markAsFailed(reason: string) : void
}

Notification - - NotificationType
Notification - - NotificationChannel
Notification - - NotificationStatus

@enduml

