@startuml use_case

skinparam shadowing false
skinparam usecase {
  BackgroundColor #FEFECE
  BorderColor #A80036
  ArrowColor #A80036
}
skinparam actor {
  BorderColor #A80036
}

title Plateforme de recrutement IA — Diagramme de cas d'utilisation

left to right direction

actor Candidat as candidat
actor "Plateformes de\nrecrutement" as plateformes

rectangle "Système — Plateforme de recrutement IA" {

  usecase "Importer un CV" as UC1
  usecase "Extraire et structurer\nle profil du CV" as UC1b
  usecase "Consulter le profil extrait" as UC2
  usecase "Configurer le seuil\nde candidature" as UC3
  usecase "Activer le mode\nauto-apply" as UC4
  usecase "Collecter les offres\nd'emploi" as UC5
  usecase "Calculer le score\nde compatibilité" as UC6
  usecase "Valider une candidature\n(mode semi-automatique)" as UC7
  usecase "Envoyer une candidature" as UC8
  usecase "Consulter l'historique\ndes candidatures" as UC9
  usecase "Recevoir une notification" as UC10

}

candidat - - UC1
candidat - - UC2
candidat - - UC3
candidat - - UC4
candidat - - UC7
candidat - - UC9
candidat - - UC10

plateformes - - UC5

UC1 .> UC1b : <<include>>
UC1b .> UC2 : <<include>>
UC5 .> UC6 : <<include>>
UC7 .> UC6 : <<include>>
UC8 .> UC6 : <<include>>
UC7 .> UC4 : <<extend>>\n(si mode\nsemi-automatique)
UC8 .> UC10 : <<include>>

@enduml

