@startuml matching_domain

skinparam classAttributeIconSize 0
skinparam shadowing false
skinparam class {
  BackgroundColor #FEFECE
  BorderColor #A80036
  ArrowColor #A80036
}

title Moteur de matching — Modèle du domaine

class Match <<Aggregate Root>> {
  - id : UUID
  - cvId : UUID
  - jobOfferId : UUID
  - semanticSimilarity : float
  - compatibilityScore : float
  - computedAt : DateTime
  - -
  + exceedsThreshold(threshold: float) : boolean
  + getScoreBreakdown() : ScoreBreakdown
}

class LLMAssessment <<Value Object>> {
  - matchingPoints : string[]
  - gapPoints : string[]
  - summary : string
}

class MatchingConfig {
  - userId : UUID
  - threshold : float
  - semanticWeight : float
  - llmWeight : float
  - -
  + validateWeights() : boolean
}

class CV <<from Gestion CV>> {
}

class JobOffer <<from Sourcing des offres>> {
}

Match "1" *- - "1" LLMAssessment
Match "0..*" - - "1" CV
Match "0..*" - - "1" JobOffer
Match "0..*" - - "1" MatchingConfig

@enduml

