link Application to ApplicationStatus--><path d="M298.56,237.2031 C289.4,257.7831 280.12,278.6431 272.03,296.8231 " fill="none" id="Application-ApplicationStatus" style="stroke: #A80036; stroke-width: 1.0;"/><!--MD5=[cb7184f8b40c0f89d0f102e566829a74]
@startuml applications_domain

skinparam classAttributeIconSize 0
skinparam shadowing false
skinparam class {
  BackgroundColor #FEFECE
  BorderColor #A80036
  ArrowColor #A80036
}

title Gestion des candidatures — Modèle du domaine

enum ApplicationMode {
  MANUAL_VALIDATION
  FULL_AUTO
}

enum ApplicationStatus {
  PENDING_VALIDATION
  APPROVED
  REJECTED
  SENT
  FAILED
}

enum AutoApplyScope {
  GLOBAL
  PER_OFFER
}

class Application <<Aggregate Root>> {
  - id : UUID
  - matchId : UUID
  - mode : ApplicationMode
  - status : ApplicationStatus
  - submittedAt : DateTime
  - validatedBy : UUID
  - failureReason : string
  - -
  + approve() : void
  + reject(reason: string) : void
  + markAsSent() : void
  + markAsFailed(reason: string) : void
  + requiresHumanValidation() : boolean
}

class UserAutoApplySettings {
  - userId : UUID
  - autoApplyEnabled : boolean
  - scope : AutoApplyScope
}

class Match <<from Moteur de matching>> {
  - autoApplyOverride : boolean
}

Application "0..*" - - "1" Match
Application "0..*" - - "1" UserAutoApplySettings
UserAutoApplySettings - - AutoApplyScope
Application - - ApplicationMode
Application - - ApplicationStatus

@enduml

