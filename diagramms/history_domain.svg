link AuditEntry to AuditDecision--><path d="M181,238.1031 C181,259.2531 181,280.3531 181,297.8131 " fill="none" id="AuditEntry-AuditDecision" style="stroke: #A80036; stroke-width: 1.0;"/><!--MD5=[26bed4d10d973aa03fda73bd6a37ff92]
@startuml history_domain

skinparam classAttributeIconSize 0
skinparam shadowing false
skinparam class {
  BackgroundColor #FEFECE
  BorderColor #A80036
  ArrowColor #A80036
}

title Historique et audit — Modèle du domaine

enum AuditDecision {
  NOT_APPLIED
  PENDING_VALIDATION
  APPLIED
}

class AuditEntry <<Aggregate Root>> <<Immutable>> {
  - id : UUID
  - userId : UUID
  - cvId : UUID
  - jobOfferId : UUID
  - matchId : UUID
  - applicationId : UUID
  - compatibilityScore : float
  - decision : AuditDecision
  - scoreBreakdownSnapshot : string
  - createdAt : DateTime
  - -
  + toDisplayableRecord() : AuditRecordDTO
}

AuditEntry - - AuditDecision

@enduml

