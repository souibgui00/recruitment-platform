@startuml history_technical

skinparam classAttributeIconSize 0
skinparam shadowing false
skinparam class {
  BackgroundColor #FEFECE
  BorderColor #A80036
  ArrowColor #A80036
}

title Historique et audit — Services techniques

interface IAuditRepository <<port>> {
  + save(entry: AuditEntry) : void
  + findByUserId(userId: UUID, filters: AuditFilters) : AuditEntry[]
  + findByCvId(cvId: UUID) : AuditEntry[]
}

class AuditFilters <<Value Object>> {
  - dateFrom : Date
  - dateTo : Date
  - decision : AuditDecision
}

class AuditService {
  - repository : IAuditRepository
  - -
  + recordDecision(match: Match, application: Application) : AuditEntry
}

AuditService - -> IAuditRepository : utilise
IAuditRepository ..> AuditFilters : utilise

@enduml

