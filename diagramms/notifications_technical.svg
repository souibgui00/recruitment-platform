@startuml notifications_technical

skinparam classAttributeIconSize 0
skinparam shadowing false
skinparam class {
  BackgroundColor #FEFECE
  BorderColor #A80036
  ArrowColor #A80036
}

title Notifications — Services techniques

interface INotificationSender <<port>> {
  + send(notification: Notification) : void
}

class EmailNotificationSender {
  + send(notification: Notification) : void
}

class InAppNotificationSender {
  + send(notification: Notification) : void
}

interface INotificationRepository <<port>> {
  + save(notification: Notification) : void
  + findByUserId(userId: UUID) : Notification[]
}

class NotificationService {
  - senders : INotificationSender[]
  - repository : INotificationRepository
  - -
  + notifyApplicationSent(application: Application) : Notification
  + notifyApplicationFailed(application: Application, reason: string) : Notification
}

INotificationSender <|.. EmailNotificationSender
INotificationSender <|.. InAppNotificationSender

NotificationService - -> INotificationSender : utilise
NotificationService - -> INotificationRepository : utilise

@enduml

